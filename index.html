<html lang="en">
<head>

    <title>Кот</title>

</head>

        <h1 id="greeting">Привет от белого кота</h1>

            </g>
            <!-- Глаза -->
            <circle cx="640" cy="1140" r="65" class="cat-eye" fill="var(--eye-color)"></circle>
        </svg>
    </div>

    <script>
        function applyTheme() {
            const hour = new Date().getHours();
            const isNight = hour < 7 || hour >= 19;
            if (isNight) {
                document.body.classList.add("dark-theme");
                document.getElementById("greeting").textContent = "Привет от белого кота";
            } else {
                document.body.classList.remove("dark-theme");
                document.getElementById("greeting").textContent = "Привет от черного кота";
            }
        }

        applyTheme();
    </script>

</body>
</html>
